[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-assistant"
version = "0.1.0"
description = "Travel-research pipeline as an importable package (+ keyless local map dashboard)"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
travel-assistant = "travel_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["travel_assistant*"]
