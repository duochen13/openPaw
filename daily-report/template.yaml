AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Daily Digest Email Agent

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs18.x

Parameters:
  GmailClientId:
    Type: String
    Description: Gmail OAuth Client ID

  RecipientEmail:
    Type: String
    Description: Email address to send digest to

  GmailClientSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-1:065424081594:secret:/openpaw/gmail/client-secret-hWktkd
    Description: ARN of existing Gmail Client Secret in Secrets Manager

  GmailRefreshTokenArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-1:065424081594:secret:/openpaw/gmail/refresh-token-e8EDsT
    Description: ARN of existing Gmail Refresh Token in Secrets Manager

  ProductHuntApiKeyArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-1:065424081594:secret:/openpaw/product-hunt/api-key-6cVJKD
    Description: ARN of existing Product Hunt API Key in Secrets Manager

  ProductHuntApiSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-1:065424081594:secret:/openpaw/product-hunt/api-secret-Q8s1Mx
    Description: ARN of existing Product Hunt API Secret in Secrets Manager

  PlaidClientIdArn:
    Type: String
    Description: ARN of Plaid client ID secret in AWS Secrets Manager
    Default: arn:aws:secretsmanager:us-east-1:065424081594:secret:/openpaw/plaid/client-id-XXXXX

  PlaidSecretArn:
    Type: String
    Description: ARN of Plaid secret in AWS Secrets Manager
    Default: arn:aws:secretsmanager:us-east-1:065424081594:secret:/openpaw/plaid/secret-XXXXX

  PlaidAccessTokenArn:
    Type: String
    Description: ARN of Plaid access token secret in AWS Secrets Manager
    Default: arn:aws:secretsmanager:us-east-1:065424081594:secret:/openpaw/plaid/access-token-XXXXX

  PlaidEnvironment:
    Type: String
    Description: Plaid environment (sandbox, development, or production)
    Default: sandbox
    AllowedValues:
      - sandbox
      - development
      - production

Resources:
  DailyDigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: openpaw-daily-digest
      CodeUri: .
      Handler: src/index.handler
      Environment:
        Variables:
          GMAIL_CLIENT_ID: !Ref GmailClientId
          GMAIL_CLIENT_SECRET_ARN: !Ref GmailClientSecretArn
          GMAIL_REFRESH_TOKEN_ARN: !Ref GmailRefreshTokenArn
          PRODUCT_HUNT_API_KEY_ARN: !Ref ProductHuntApiKeyArn
          PRODUCT_HUNT_API_SECRET_ARN: !Ref ProductHuntApiSecretArn
          RECIPIENT_EMAIL: !Ref RecipientEmail
          TIMEZONE: America/Los_Angeles
          PLAID_CLIENT_ID_ARN: !Ref PlaidClientIdArn
          PLAID_SECRET_ARN: !Ref PlaidSecretArn
          PLAID_ACCESS_TOKEN_ARN: !Ref PlaidAccessTokenArn
          PLAID_ENVIRONMENT: !Ref PlaidEnvironment
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref GmailClientSecretArn
              - !Ref GmailRefreshTokenArn
              - !Ref ProductHuntApiKeyArn
              - !Ref ProductHuntApiSecretArn
              - !Ref PlaidClientIdArn
              - !Ref PlaidSecretArn
              - !Ref PlaidAccessTokenArn
      Events:
        DailyTrigger:
          Type: Schedule
          Properties:
            Schedule: cron(0 17 * * ? *)
            Description: Trigger daily digest at 10am PT

Outputs:
  DailyDigestFunctionArn:
    Description: Daily Digest Lambda Function ARN
    Value: !GetAtt DailyDigestFunction.Arn

  DailyDigestFunctionName:
    Description: Daily Digest Lambda Function Name
    Value: !Ref DailyDigestFunction
