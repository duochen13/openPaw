# The configured universe. Adding an entry here is the only change needed to
# widen it.
tickers:
  - symbol: META
    cik: 1326801
    name: Meta Platforms, Inc.
    aliases: ["Meta", "Facebook", "Meta Platforms"]
  - symbol: NOW
    cik: 1373715
    name: ServiceNow, Inc.
    aliases: ["ServiceNow", "ServiceNow Inc"]
  - symbol: GOOGL
    cik: 1652044
    name: Alphabet Inc.
    aliases: ["Google", "Alphabet", "Alphabet Inc"]
  - symbol: TSLA
    cik: 1318605
    name: Tesla, Inc.
    aliases: ["Tesla", "Tesla Inc"]
  - symbol: NVDA
    cik: 1045810
    name: NVIDIA Corporation
    aliases: ["NVIDIA", "Nvidia", "NVIDIA Corporation"]
  - symbol: CRM
    cik: 1108524
    name: Salesforce, Inc.
    aliases: ["Salesforce", "Salesforce Inc"]
  - symbol: ORCL
    cik: 1341439
    name: Oracle Corporation
    aliases: ["Oracle", "Oracle Corporation"]

# Beta is measured against this. QQQ matches the sibling repo's watchlist.
benchmark: QQQ

# Index charts (#57). Indices have no CIK and no EDGAR fundamentals; they
# are first-class charts with their own benchmark so an index is never
# measured against itself. `yahoo` is the Yahoo Finance ticker used at
# ingest (NDX -> ^NDX); `benchmark` overrides the default below.
index_benchmark: SPY
indices:
  - symbol: QQQ
    name: Invesco QQQ Trust
    yahoo: QQQ
  - symbol: NDX
    name: Nasdaq-100 Index
    yahoo: ^NDX
  - symbol: SPY
    name: SPDR S&P 500 ETF Trust
    yahoo: SPY
    benchmark: QQQ

# Industry benchmark per symbol, drawn as a third line in the compare view
# next to the market benchmark. Unmapped symbols render the two-line chart
# exactly as before. Note MAGS listed in April 2023, so its history is much
# shorter than the stock series; the chart only uses the overlapping window.
industry_benchmarks:
  NOW: CLOU # SaaS: Global X Cloud Computing ETF
  MSFT: CLOU
  GOOGL: MAGS # Mag7: Roundhill Magnificent Seven ETF
  META: MAGS
  NVDA: SOXX # AI chips: iShares Semiconductor ETF

# Six years, not five. A 250-day beta window consumes the first trading year,
# so five years of fetched prices would yield only four years of evaluable
# days (spec §5).
price_years: 6

moves:
  beta_window: 250
  sigma_window: 60
  z_threshold: 2.5

# Earliest META news measured in the previous session: 2020-01-21. Moves before this date are
# flagged news_coverage_known_thin in Plan 2 (spec §7).
news_coverage_start: "2020-01-21"

paths:
  db: data/prices.sqlite
  moves: data/moves
  events: data/events
  reasons: data/reasons
  cache: data/cache
  reddit: data/reddit
  out: out
