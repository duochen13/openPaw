  "notes": [
    "Actuals are the as-printed percent changes from each BLS PPI release (final demand: m/m seasonally adjusted, y/y unadjusted; core = final demand less foods and energy) - the vintage the market saw on the release morning. Values are cross-checked against index levels from the BLS public API (WPUFD4 / WPSFD4, WPUFD49104 / WPSFD49104). PPI indexes are revised for four months after publication, so the API's current vintage legitimately differs from older as-printed values; the archive prints stand.",
    "Consensus is null for every backfilled release: no PPI survey median has been hand-verified yet (see CONSENSUS in scripts/collect_ppi.py). It is never estimated, and null consensus means no surprise and no macro classification for PPI days until one is sourced.",
    "Prior is the previous published release's actual. October 2025 was never published (federal shutdown) and the September 2025 release was delayed to 2025-11-25, so the 2026-01-14 release chains to September 2025. There is no October 2025 row - the gap is explicit, never interpolated.",
    "Revision is null throughout: the file keeps as-printed values; BLS's four-month revisions and the annual seasonal-factor recalculation are not restated.",
    "Four releases carry a per-release note: their archive pages returned HTTP 403 to the collector's fetcher, so their values were transcribed from the following release's tables (first revised vintage) with core y/y computed from the BLS API index levels."
  ],
