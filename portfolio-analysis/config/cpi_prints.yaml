  "notes": [
    "Actuals are the as-printed Table A percent changes from each BLS release (m/m seasonally adjusted, y/y unadjusted) - the vintage the market saw on the release morning. Headline values are cross-checked against index levels from the BLS public API (CUUR0000SA0 / CUSR0000SA0).",
    "Consensus is stored only where a survey median was verified by hand for that release (see CONSENSUS in scripts/collect_cpi.py); it is null elsewhere and is never estimated.",
    "Prior is the previous published release's actual. October 2025 was never published (federal shutdown), so the 2025-12-18 release chains to September 2025 and its 1-month changes are null - BLS published only a 2-month change for November 2025.",
    "Revision is null throughout: the not-seasonally-adjusted series is never revised, and seasonally adjusted values change only via the annual February seasonal-factor recalculation, which this file does not restate."
